<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3b34">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>創業サポート</title>
<style>
:root{
  --bg:#f3f6f5; --card:#fff; --ink:#1b2724; --sub:#5a6763; --line:#dfe6e3; --soft:#f5f8f7;
  --pri:#1f7a63; --pri-weak:#e3f3ee; --blue:#2f6fd0; --blue-weak:#e8effc; --ok:#13804a; --ok-weak:#e2f4e9;
  --bad:#c42e2e; --bad-weak:#fdebeb; --warn:#9a5b00; --warn-weak:#fff3dd; --nav:#1d3b34; --nav-on:#2f5a4f;
  --exp:#e0782b; --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
.side{width:200px;flex-shrink:0;background:var(--nav);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 10px 14px calc(10px + env(safe-area-inset-left))}
.side .brand{font-weight:700;font-size:18px;padding:6px 10px 14px;line-height:1.3}
.side .brand small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:3px;word-break:break-all}
.side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#d8e6e1;padding:12px;border-radius:10px;font-size:16px;text-align:left;cursor:pointer;min-height:48px}
.side button.on{background:var(--nav-on);color:#fff;font-weight:700}
.side .ico{width:24px;text-align:center;font-size:18px}
.bottom{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.bottom button{flex:1;border:0;background:none;color:#cfe0da;font-size:11px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:8px;min-height:54px;cursor:pointer;min-width:0}
.bottom button .ico{font-size:20px;line-height:1.2}
.bottom button.on{color:#fff;background:var(--nav-on);font-weight:700}
main{flex:1;min-width:0;padding:calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 48px 18px;max-width:1280px}
@media (max-width:859px){
  .side{display:none} .bottom{display:flex}
  main{padding:calc(10px + env(safe-area-inset-top)) 12px 100px}
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:22px;margin:0}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex-shrink:0;border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:999px;font-size:15px;cursor:pointer;min-height:44px;white-space:nowrap}
.subtabs button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(20,40,30,.07);margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 10px}
.card h3{font-size:16px;margin:16px 0 6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.split{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:1000px){ .split{grid-template-columns:minmax(0,5fr) minmax(0,6fr)} .sticky{position:sticky;top:14px} }
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.kpi{background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 2px rgba(20,40,30,.07)}
.kpis.flat .kpi{background:var(--soft);box-shadow:none}
.kpi .l{font-size:13px;color:var(--sub)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.kpi .v small{font-size:13px;font-weight:400;margin-left:2px}
.kpi .s{font-size:12px;color:var(--sub);margin-top:2px}
.muted{color:var(--sub)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.plus{color:var(--ok)} .minus{color:var(--bad)}
label.f{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px;font-weight:600}
.inp,select.inp,textarea.inp{width:100%;border:1px solid #c9d3cf;border-radius:10px;padding:10px 12px;background:#fff;min-height:48px;font-size:16px}
textarea.inp{line-height:1.6;resize:vertical}
.inp:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}
.inp.big{font-size:26px;font-weight:700;text-align:right;min-height:60px;font-variant-numeric:tabular-nums}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #c9d3cf;background:#fff;border-radius:10px;padding:10px 18px;min-height:48px;cursor:pointer;font-size:16px;font-weight:600;text-decoration:none}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--pri)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.wide{width:100%}
.btn.dashed{border-style:dashed;color:var(--sub);width:100%;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;border:2px solid #c9d3cf;background:#fff;border-radius:10px;padding:10px 12px;min-height:48px;cursor:pointer;font-size:15px;font-weight:600}
.seg button.on{border-color:var(--pri);background:var(--pri-weak);color:var(--pri)}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.kind button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-size:18px;font-weight:700;cursor:pointer;min-height:64px}
.kind button.on.in{border-color:var(--blue);background:var(--blue-weak);color:var(--blue)}
.kind button.on.out{border-color:var(--exp);background:#fdf0e6;color:#b35610}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;min-height:40px}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips .cls{font-size:12px;color:var(--sub);width:100%;margin-top:6px}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--sub);margin:8px 0}
.note.warn{background:var(--warn-weak);color:var(--warn)}
.note.ok{background:var(--ok-weak);color:var(--ok)}
.note.bad{background:var(--bad-weak);color:var(--bad)}
.note.info{background:var(--blue-weak);color:#24508f}
.note b{font-weight:700}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-size:13px;color:var(--sub);text-align:left;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:var(--soft)}
tr.grp td{background:#eaf1ee;font-weight:700;font-size:13px;color:var(--sub)}
td.fut,th.fut{background:#fbfaf3}
th.fut{background:#f4f1e1}
td.lbl{white-space:nowrap;position:sticky;left:0;background:#fff;z-index:1}
tr.tot td.lbl,tr.grp td.lbl{background:inherit}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--pri-weak);color:var(--pri);margin-left:4px;white-space:nowrap;vertical-align:1px}
.badge.plan{background:#f4ecd5;color:#7d5a00}
.badge.late{background:var(--bad-weak);color:var(--bad)}
.stmt .ln{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px dashed var(--line)}
.stmt .ln.t{font-weight:700;background:var(--soft);border-bottom:0;padding:8px 8px;border-radius:6px;margin-top:4px}
.stmt .ln.big{font-size:18px;background:var(--pri-weak);color:var(--pri)}
.stmt .ln.in{padding-left:16px;font-size:14px;color:var(--sub)}
.hbar{display:grid;grid-template-columns:minmax(80px,150px) 1fr auto;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.hbar .bar{height:16px;border-radius:4px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--sub);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.legend i.ln{height:3px;vertical-align:3px;width:16px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:0}
.list-item .when{font-size:13px;color:var(--sub);white-space:nowrap;min-width:52px}
.list-item .what{flex:1;min-width:0}
.list-item .what .m{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.irow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.irow .inp{min-height:44px;padding:8px 10px}
.irow .w1{flex:1 1 100px} .irow .w2{flex:2 1 130px} .irow .w3{flex:3 1 130px}
.irow .amt{flex:0 0 120px;width:120px}
.x{flex:0 0 40px;height:40px;border:0;background:none;color:#98a5a0;font-size:22px;cursor:pointer;border-radius:8px}
.x:hover{background:var(--bad-weak);color:var(--bad)}
.tot-line{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;padding:8px 2px 0;border-top:1px solid var(--line);margin-top:6px}
.tot-line .num{font-size:20px}
.hero{background:var(--nav);color:#fff;border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.hero .l{font-size:14px;opacity:.85}
.hero .v{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.hero .s{font-size:14px;opacity:.85;margin-top:4px}
.prog{height:12px;background:#e4ebe8;border-radius:999px;overflow:hidden;margin-top:8px}
.prog > div{height:100%;background:var(--pri);border-radius:999px}
.steps{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.step{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff;text-align:left;min-height:60px}
.step .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--sub)}
.step.done .n{background:var(--ok);color:#fff}
.step .t{font-weight:600;font-size:15px}
.step .d{font-size:12px;color:var(--sub)}
.monthnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monthnav b{font-size:18px;min-width:120px;text-align:center}
.tip{border-left:4px solid var(--pri);padding:4px 12px;margin:8px 0;font-size:14px}
details.help{margin-top:10px}
details.help summary{cursor:pointer;color:var(--pri);font-weight:600;font-size:14px;min-height:36px;display:flex;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2724;color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hide{display:none!important}
.sec-no{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;align-items:center;justify-content:center;font-size:14px;margin-right:8px;vertical-align:1px}
.bar-tools{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}

/* ---- 印刷（PDF保存）用 ---- */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm 12mm 14mm}
  body{background:#fff}
  #app,.bottom,.toast{display:none!important}
  #print{display:block}
}
.pdoc{color:#000;font-size:10pt;line-height:1.45}
.pdoc .ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.pdoc h1{font-size:18pt;letter-spacing:.4em;margin:0;text-align:center;flex:1}
.pdoc .meta{font-size:9.5pt;text-align:right;line-height:1.5}
.pdoc h2{font-size:10.5pt;margin:9px 0 3px;padding:2px 6px;background:#e6e6e6;border-left:4px solid #000}
.pdoc table{width:100%;border-collapse:collapse;font-size:9.5pt}
.pdoc th,.pdoc td{border:1px solid #444;padding:3px 6px;vertical-align:top;color:#000;height:22px}
.pdoc th{background:#f0f0f0;font-weight:600;white-space:nowrap;font-size:9pt;text-align:left}
.pdoc td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pdoc td.c{text-align:center}
.pdoc .sec{break-inside:avoid;page-break-inside:avoid}
.pdoc .tall{min-height:42px}
.pdoc .pb{break-before:page;page-break-before:always}
.pdoc .foot{font-size:8pt;color:#444;margin-top:8px}
.pdoc tr.tt td{font-weight:700;background:#f6f6f6}
</style>
</head>
<body>
<div id="app">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<nav class="bottom" id="bottom"></nav>
<div class="toast" id="toast"></div>
<div id="print"></div>
<input type="file" id="file" class="hide">

<script>
'use strict';
/* =========================================================
   創業サポート（資金繰り・収支計画・経営分析・創業計画書）
   データはこの端末のブラウザ（localStorage）にだけ保存されます
   ========================================================= */
const KEY = 'sogyo_v1';
const APP_VER = '1.1';

/* ---------- 入出金のカテゴリと分類 ---------- */
// 分類: sales売上 other他入金 loan借入 capital自己資金 / var変動費 fixed固定費 capex設備 repay返済 owner生活費・税
const IN_CATS = [['売上','sales'],['その他の入金','other'],['借入','loan'],['自己資金の追加','capital']];
const OUT_CATS = [
  ['仕入','var'],['外注費','var'],['材料・資材','var'],
  ['家賃','fixed'],['人件費','fixed'],['水道光熱費','fixed'],['通信費','fixed'],['広告宣伝費','fixed'],
  ['旅費交通費','fixed'],['消耗品費','fixed'],['支払手数料','fixed'],['支払利息','fixed'],['保険料','fixed'],['その他の経費','fixed'],
  ['設備の購入','capex'],['借入の返済','repay'],['生活費','owner'],['税金・社会保険','owner']
];
const CLASS_LABEL = {sales:'売上',other:'その他の入金',loan:'借入',capital:'自己資金',var:'変動費（仕入・外注など）',fixed:'固定費（毎月の経費）',capex:'設備の購入',repay:'借入の返済',owner:'生活費・税金・社会保険'};
const CLASS_OF = {};
IN_CATS.forEach(([c,k]) => CLASS_OF['in:'+c] = k);
OUT_CATS.forEach(([c,k]) => CLASS_OF['out:'+c] = k);
const clsOf = t => CLASS_OF[t.type+':'+t.cat] || (t.type === 'in' ? 'other' : 'fixed');
// 旧「資金繰り管理」アプリのカテゴリ名 → 新カテゴリ名
const OLD_CAT = {'入金その他':'その他の入金','生活費引出':'生活費','税金・保険':'税金・社会保険','その他':'その他の経費'};

/* ---------- 業種プリセット ---------- */
const PRESETS = {
  standard:{label:'基本（創業計画表のかたち）',
    price:[['商品・サービスの単価',5000]], cost:[['仕入・材料',2000]],
    fixed:[['人件費',0],['家賃',50000],['電気・水道代',10000],['通信費',10000],['広告宣伝費',10000],['その他の経費（借入返済を含む）',20000]]},
  freelance:{label:'Web制作・エンジニア・ライター',
    price:[['制作・開発案件（1件）',200000]], cost:[['素材・有料プラグイン',5000],['外注費',0]],
    fixed:[['通信費（スマホ・ネット）',12000],['会計ソフト',2000],['ソフト・ツール代',7000],['サーバー代（自社用）',1000],['その他の経費（借入返済を含む）',10000]]},
  retail:{label:'ネットショップ・物販',
    price:[['商品の平均単価',5000]], cost:[['商品仕入',2500],['梱包資材',150],['送料負担分',800],['決済手数料（約4%）',200]],
    fixed:[['カートシステム利用料',3000],['在庫の保管場所',10000],['広告宣伝費',30000],['通信費',8000],['借入金の返済',0]]},
  cafe:{label:'飲食店・カフェ',
    price:[['ランチセット',1200],['追加ドリンク',300]], cost:[['食材原価',450],['おしぼり等消耗品',30]],
    fixed:[['人件費（パート）',0],['店舗家賃',150000],['水道光熱費',35000],['POSレジ利用料',5000],['広告費（グルメサイト等）',20000],['借入金の返済',0]]},
  salon:{label:'美容室・サロン・整体',
    price:[['施術コース（60分）',8000]], cost:[['アメニティ・消耗品',300],['ドリンク・お茶菓子',100]],
    fixed:[['店舗家賃',80000],['予約システム・広告費',30000],['水道光熱費',15000],['通信費',6000],['借入金の返済',0]]}
};

const TIPS = [
  '入金はできるだけ早く、支払いはできるだけ遅く。請求から入金までの期間を短くすると、手元のお金に余裕が出ます。',
  '固定費（毎月かかる経費）の見直しは、いちばん効果の大きい資金繰り改善策です。',
  '利益が出ていても、入金が遅れると現金は足りなくなります（黒字倒産）。資金繰り表で数か月先まで確認しましょう。',
  '所得税・住民税・国民健康保険は前年の所得で決まり、翌年に請求が来ます。黒字の月は少しずつ取り分けておきましょう。',
  '事業用と生活用の口座を分けると、お金の流れがひと目でわかります。',
  '値上げは客数を増やすより効果が大きいことがあります。「収支計画」の「客単価を変えたら」で確かめてみましょう。',
  '手元の現金は、毎月の支出の2〜3か月分あると安心と言われます。'
];

/* ---------- 小さな道具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(String(v ?? '').replace(/[,，¥￥円\s]/g, '')); return isFinite(n) ? n : 0; };
const yen = v => (Math.round(v) < 0 ? '-' : '') + '¥' + Math.abs(Math.round(v)).toLocaleString('ja-JP');
const comma = v => Math.round(v).toLocaleString('ja-JP');
// キリのいい値段に切り上げ（1,000円未満は10円、1万円未満は100円、それ以上は1,000円単位）
const niceUp = p => { if (p <= 0) return 0; const u = p < 1000 ? 10 : p < 10000 ? 100 : 1000; return Math.ceil(Math.round(p * 100) / 100 / u) * u; };
const pct = (v, d = 1) => (isFinite(v) ? (v * 100).toFixed(d) : '0') + '%';
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());   // ローカル日付（UTCずれ無し）
const today = () => ymd(new Date());
const ymOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const curYM = () => ymOf(new Date());
const addMonth = (ym, k) => { const [y, m] = ym.split('-').map(Number); return ymOf(new Date(y, m - 1 + k, 1)); };
const addMonthDate = (s, k) => { const [y, m, d] = s.split('-').map(Number); const last = new Date(y, m - 1 + k + 1, 0).getDate(); return ymd(new Date(y, m - 1 + k, Math.min(d, last))); };
const ymLabel = ym => { const [y, m] = ym.split('-'); return y + '年' + Number(m) + '月'; };
const mdLabel = s => { const [, m, d] = s.split('-'); return Number(m) + '/' + Number(d); };
const jpDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return y + '年' + Number(m) + '月' + Number(d) + '日'; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sumAmt = list => list.reduce((a, i) => a + num(i.amount), 0);
const clone = o => JSON.parse(JSON.stringify(o));

// 足りない項目を補う（古いデータ・バックアップも読めるように）
function merge(def, val) {
  if (Array.isArray(def)) return Array.isArray(val) ? val : def;
  if (def && typeof def === 'object') {
    const out = {...(val && typeof val === 'object' && !Array.isArray(val) ? val : {})};
    for (const k in def) out[k] = merge(def[k], val ? val[k] : undefined);
    return out;
  }
  return val === undefined || val === null ? def : val;
}
function normalize(d) {
  const s = merge(defaults(), d || {});
  s.tx = s.tx.filter(t => t && isYmd(t.date) && (t.type === 'in' || t.type === 'out')).map(t => ({
    id: t.id ? String(t.id) : uid(), date: t.date, type: t.type, cat: t.cat || (t.type === 'in' ? '売上' : 'その他の経費'),
    amount: Math.abs(num(t.amount)), memo: t.memo || '', plan: !!t.plan
  }));
  ['price','cost','fixed'].forEach(k => s.sim[k] = s.sim[k].map(i => ({id: i.id ? String(i.id) : uid(), name: i.name || '', amount: num(i.amount)})));
  return s;
}

/* ---------- 計算 ---------- */
function zeroAgg() { return {sales:0,other:0,loan:0,capital:0,var:0,fixed:0,capex:0,repay:0,owner:0,byCat:{},count:0}; }
function monthAgg(ym, withPlan) {
  const r = zeroAgg();
  S.tx.forEach(t => {
    if (t.date.slice(0, 7) !== ym || (t.plan && !withPlan)) return;
    const c = clsOf(t); r[c] += num(t.amount); r.count++;
    if (c === 'var' || c === 'fixed') r.byCat[t.cat] = (r.byCat[t.cat] || 0) + num(t.amount);
  });
  return r;
}
function currentBalance() { return num(S.profile.openCash) + S.tx.filter(t => !t.plan).reduce((a, t) => a + (t.type === 'in' ? 1 : -1) * num(t.amount), 0); }

function calcSim() {
  const s = S.sim;
  const fixed = sumAmt(s.fixed), costAuto = sumAmt(s.cost), living = num(s.living);
  // 原価の内訳＋理想の粗利率から売値を決めるとき：売値 ＝ 原価 ÷（1 − 粗利率）
  const byGp = s.gpMode === 'auto' && s.priceMode === 'gp';
  const gpT = num(s.gpTarget) / 100;
  const price = byGp ? (gpT > 0 && gpT < 1 ? costAuto / (1 - gpT) : 0) : sumAmt(s.price);
  const gp = s.gpMode === 'manual' ? num(s.gpManual) / 100 : byGp ? (gpT < 1 ? gpT : 0) : (price > 0 ? (price - costAuto) / price : 0);
  const valid = gp > 0 && gp <= 1;
  const need = living + fixed;
  const target = valid ? need / gp : 0;
  const bep = valid ? fixed / gp : 0;
  const unitGp = price * gp;
  const cust = valid && unitGp > 0 ? Math.ceil(need / unitGp) : 0;
  const bepCust = valid && unitGp > 0 ? Math.ceil(fixed / unitGp) : 0;
  const days = num(s.days);
  const perDay = days > 0 ? cust / days : 0;
  const planCust = num(s.planCust);
  const planSales = planCust * price;
  return {fixed, price, costAuto, living, gp, valid, byGp, gpT, need, target, bep, unitGp, cust, bepCust, days, perDay, planCust, planSales, diff: planSales - target};
}

// 資金繰り表（過去は実績のみ、今月以降は予定も含む見込み）
function cashTable() {
  const cur = curYM();
  let first = (isYmd(S.profile.openDate) ? S.profile.openDate : today()).slice(0, 7), lastTx = cur;
  S.tx.forEach(t => { const m = t.date.slice(0, 7); if (m < first) first = m; if (m > lastTx) lastTx = m; });
  let last = addMonth(cur, 3);
  if (lastTx > last) last = lastTx > addMonth(cur, 12) ? addMonth(cur, 12) : lastTx;
  const cols = []; let bal = num(S.profile.openCash), guard = 0;
  for (let m = first; m <= last && guard < 600; m = addMonth(m, 1), guard++) {
    const fut = m >= cur;
    const r = monthAgg(m, fut);
    const inSum = r.sales + r.other + r.loan + r.capital;
    const outSum = r.var + r.fixed + r.capex + r.repay + r.owner;
    cols.push({ym: m, fut, cur: m === cur, start: bal, ...r, inSum, outSum, net: inSum - outSum, end: bal + inSum - outSum});
    bal += inSum - outSum;
  }
  return cols;
}
function overduePlans() { const d = today(); return S.tx.filter(t => t.plan && t.date < d); }

/* ---------- グラフ（SVG・外部ライブラリなし） ---------- */
function niceStep(raw) { if (raw <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function shortYen(v) { const a = Math.abs(v); if (a >= 1e8) return (v / 1e8).toFixed(1).replace(/\.0$/, '') + '億'; if (a >= 1e4) return Math.round(v / 1e4).toLocaleString() + '万'; return Math.round(v).toLocaleString(); }
function chartSVG({labels, bars = [], lines = [], hl = -1, H = 280}) {
  const W = 760, L = 58, R = 10, T = 14, B = 34;
  const vals = [0];
  bars.forEach(b => b.data.forEach(v => vals.push(v)));
  lines.forEach(l => l.data.forEach(v => v != null && vals.push(v)));
  let max = Math.max(...vals), min = Math.min(...vals);
  if (max === min) max = min + 10000;
  const step = niceStep((max - min) / 4);
  max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  const y = v => T + (max - v) / (max - min) * (H - T - B);
  const n = Math.max(1, labels.length), cw = (W - L - R) / n;
  let g = '';
  if (hl >= 0) g += `<rect x="${L + cw * hl}" y="${T}" width="${cw}" height="${H - T - B}" fill="#f4f1e1"/>`;
  for (let v = min; v <= max + 1e-6; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? '#9aa8a3' : '#e5ebe8'}" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${y(v) + 4}" font-size="12" text-anchor="end" fill="#5a6763">${shortYen(v)}</text>`;
  }
  const gw = cw * 0.72, bw = bars.length ? gw / bars.length : 0;
  bars.forEach((b, bi) => b.data.forEach((v, i) => {
    const x = L + cw * i + (cw - gw) / 2 + bw * bi, y1 = y(Math.max(v, 0)), y2 = y(Math.min(v, 0));
    g += `<rect x="${x + 1}" y="${y1}" width="${Math.max(1, bw - 2)}" height="${Math.max(0, y2 - y1)}" rx="2" fill="${b.color}"><title>${esc(labels[i])} ${esc(b.name)} ${yen(v)}</title></rect>`;
  }));
  lines.forEach(l => {
    const pts = l.data.map((v, i) => v == null ? null : [L + cw * i + cw / 2, y(v)]).filter(Boolean);
    if (pts.length) g += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${l.color}" stroke-width="2.5" ${l.dash ? 'stroke-dasharray="6 5"' : ''}/>`;
    if (!l.dash) l.data.forEach((v, i) => { if (v != null) g += `<circle cx="${L + cw * i + cw / 2}" cy="${y(v)}" r="3.5" fill="${l.color}"><title>${esc(labels[i])} ${esc(l.name)} ${yen(v)}</title></circle>`; });
  });
  const every = n > 12 ? 2 : 1;
  labels.forEach((lb, i) => { if (i % every === 0) g += `<text x="${L + cw * i + cw / 2}" y="${H - 12}" font-size="12" text-anchor="middle" fill="#5a6763">${esc(lb)}</text>`; });
  const lg = bars.map(b => `<span><i style="background:${b.color}"></i>${esc(b.name)}</span>`).concat(lines.map(l => `<span><i class="ln" style="background:${l.color}"></i>${esc(l.name)}</span>`)).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="legend">${lg}</div>`;
}
const mLabel = ym => { const [y, m] = ym.split('-'); return Number(m) === 1 ? y.slice(2) + '/1月' : Number(m) + '月'; };

function simResults() {
  const r = calcSim();
  const head = `<div class="row end" style="margin-bottom:8px"><button class="btn sm" onclick="App.go('bp');App.bpReflect()">📄 創業計画書に反映する</button></div>`;
  if (!r.valid) return `<div class="card"><h2>計算結果</h2>${r.byGp
    ? '<div class="note bad">理想の粗利率を、0より大きく100％未満で入れてください。</div>'
    : '<div class="note bad"><b>粗利がマイナス（または0）です。</b>このままでは売るほど赤字になります。売値を上げるか、原価を下げてください。</div>'}</div>`;
  const sens = [0.9, 1, 1.1, 1.2].map(k => {
    const p = r.price * k, cost = r.price * (1 - r.gp), ug = p - cost, gp = p > 0 ? ug / p : 0;
    const c = ug > 0 ? Math.ceil(r.need / ug) : 0;
    return `<tr${k === 1 ? ' class="tot"' : ''}><td>${k === 1 ? 'いまの単価' : (k > 1 ? '+' : '') + Math.round((k - 1) * 100) + '%'}</td><td class="num">${yen(p)}</td><td class="num">${pct(gp, 0)}</td><td class="num">${ug > 0 ? comma(c) + '人' : '—'}</td><td class="num">${ug > 0 && r.days ? (c / r.days).toFixed(1) + '人' : '—'}</td></tr>`;
  }).join('');
  const warns = [];
  if (r.gp < 0.2) warns.push('<div class="note warn">粗利率が20%未満と低めです。薄利多売になりやすいため、広告費のかけすぎに注意しましょう。</div>');
  if (r.days && r.perDay > 30) warns.push(`<div class="note warn">1日に${r.perDay.toFixed(1)}人の対応が必要です。ひとりで回せるか、人を雇うか、単価を上げられないか検討しましょう。</div>`);
  if (r.price <= 0) warns.push(`<div class="note warn">${r.byGp ? '原価を入れると売値が決まり' : '客単価を入れると'}、必要な客数が計算されます。</div>`);

    plan = `<h3>販売計画との比較</h3><div class="stmt">
      <div class="ln"><span>販売計画の売上（${comma(r.planCust)}人 × ${yen(r.price)}）</span><span class="num">${yen(r.planSales)}</span></div>

      ${r.diff >= 0 ? '<div class="note ok">目標を達成できる計画です。</div>' : `<div class="note warn">あと月${comma(Math.ceil(-r.diff / r.price))}人、または客単価を${yen(Math.ceil(r.target / r.planCust))}にすると目標に届きます。</div>`}`;
  }
  return `${head}
  <div class="hero"><div class="l">目標売上（月）</div><div class="v">${yen(r.target)}</div><div class="s">年間 ${yen(r.target * 12)}　／　必要なお客さま 月${comma(r.cust)}人${r.days ? `（1日あたり${r.perDay.toFixed(1)}人）` : ''}</div></div>

    <div class="stmt">

      <div class="ln"><span>② 固定費</span><span class="num">${yen(r.fixed)}</span></div>

function updateSim() {
  const s = S.sim, r = calcSim();

}

/* ---------- 経営分析 ---------- */
function anaMonths() {
  if (UI.anaPeriod === 'last12') { const c = curYM(); return Array.from({length: 12}, (_, i) => addMonth(c, i - 11)); }
  return Array.from({length: 12}, (_, i) => UI.anaPeriod + '-' + pad(i + 1));
}
function vAna() {
  const years = [...new Set(S.tx.map(t => t.date.slice(0, 4)).concat([String(new Date().getFullYear())]))].sort().reverse();
  const months = anaMonths(), sim = calcSim();
  const data = months.map(m => { const a = monthAgg(m, false); const gpv = a.sales - a.var; const op = gpv - a.fixed; const h = num(S.hours[m]); return {m, ...a, gpv, op, h, has: a.sales + a.var + a.fixed > 0}; });
  const act = data.filter(d => d.has);
  const T = k => act.reduce((s, d) => s + d[k], 0);
  const sales = T('sales'), vr = T('var'), fx = T('fixed'), gpv = sales - vr, op = gpv - fx, hrs = act.reduce((s, d) => s + d.h, 0);
  const gpr = sales > 0 ? gpv / sales : 0;
  const avgFx = act.length ? fx / act.length : 0;
  const bep = gpr > 0 ? avgFx / gpr : 0;
  const hourly = hrs > 0 ? op / hrs : 0;
  const reach = sim.target > 0 ? act.filter(d => d.sales >= sim.target).length : 0;
  const cats = {}; act.forEach(d => Object.entries(d.byCat).forEach(([k, v]) => cats[k] = (cats[k] || 0) + v));
  const catList = Object.entries(cats).sort((a, b) => b[1] - a[1]); const catMax = catList.length ? catList[0][1] : 1;
  const fixedCats = new Set(OUT_CATS.filter(c => c[1] === 'fixed').map(c => c[0]));
  // 診断
  const adv = [];
  if (!act.length) adv.push('<div class="note">入出金を記録すると、ここに分析が表示されます。</div>');
  else {
    const margin = sales > 0 ? op / sales : 0;
    if (sales === 0) adv.push('<div class="note warn">この期間は売上の記録がありません。</div>');
    else if (margin < 0) adv.push(`<div class="note bad"><b>経費が売上を上回っています（利益率 ${pct(margin)}）。</b>単価・客数・固定費のどこを変えるか、収支計画で試算してみましょう。</div>`);
    else if (margin < 0.1) adv.push(`<div class="note warn"><b>利益率が低めです（${pct(margin)}）。</b>価格の見直しか、原価・経費の削減を考えましょう。</div>`);
    else if (margin > 0.3) adv.push(`<div class="note ok"><b>しっかり利益が出ています（利益率 ${pct(margin)}）。</b>税金の支払いに備えて取り分けつつ、次の投資も考えましょう。</div>`);
    if (sim.valid && sales > 0 && Math.abs(gpr - sim.gp) > 0.05) adv.push(`<div class="note ${gpr < sim.gp ? 'warn' : 'ok'}">実際の粗利率は <b>${pct(gpr)}</b>、計画は ${pct(sim.gp)} です。${gpr < sim.gp ? '原価が計画より高くなっていないか確認しましょう。' : '計画より良い粗利率です。'}</div>`);
    if (sim.valid && act.length && avgFx > sim.fixed * 1.1) adv.push(`<div class="note warn">固定費が月平均 <b>${yen(avgFx)}</b> と、計画（${yen(sim.fixed)}）より多くなっています。</div>`);
    if (sales > 0 && fx / sales > 0.5) adv.push('<div class="note warn">売上の半分以上が固定費で消えています。サブスク・家賃など毎月の費用を見直す余地がないか確認しましょう。</div>');
    if (hrs > 0 && hourly < 1500) adv.push(`<div class="note info">時間あたりの利益が <b>${yen(hourly)}</b> と低めです。時間のかかる作業の見直し・外注・値上げを検討しましょう。</div>`);
    if (sim.target > 0) adv.push(`<div class="note">目標売上（${yen(sim.target)}）を達成した月：<b>${reach}か月</b> ／ 記録のある${act.length}か月</div>`);
    if (adv.length === 0) adv.push('<div class="note ok">特に気になる点はありません。この調子で記録を続けましょう。</div>');
  }
  const chart = chartSVG({labels: months.map(mLabel),
    bars: [{name: '売上', color: '#5b8fd9', data: data.map(d => d.sales)}],
    lines: [{name: '利益（売上−経費）', color: '#1f7a63', data: data.map(d => d.has ? d.op : null)}].concat(sim.target > 0 ? [{name: '目標売上', color: '#e0782b', dash: true, data: data.map(() => sim.target)}] : [])});

  <div class="card"><h2>売上・利益の推移</h2>${chart}</div>

function bpCalc() {
  const b = S.bp;
  const need = sumAmt(b.equip) + sumAmt(b.work);
  const fund = num(b.funds.own) + num(b.funds.family) + num(b.funds.bank) + num(b.funds.other);
  const o = k => { const x = b.outlook[k]; const exp = num(x.staff) + num(x.rent) + num(x.interest) + num(x.other); return {exp, pro: num(x.sales) - num(x.cost) - exp}; };
  return {need, fund, start: o('start'), later: o('later')};
}
function updateBpCalc() {
  if (!$('b-need')) return;
  const c = bpCalc();
  $('b-need').textContent = yen(c.need); $('b-fund').textContent = yen(c.fund);
  $('b-match').innerHTML = c.need === 0 && c.fund === 0 ? '' : c.need === c.fund ? '<div class="note ok">必要な資金と調達の合計が一致しています。</div>' : `<div class="note warn">必要な資金と調達の合計が一致していません（差額 ${yen(c.fund - c.need)}）。同じ金額になるようにしましょう。</div>`;
  ['start', 'later'].forEach(k => { $('o-exp-' + k).textContent = comma(c[k].exp); $('o-pro-' + k).textContent = comma(c[k].pro); $('o-pro-' + k).className = 'num ' + (c[k].pro < 0 ? 'minus' : ''); });
}
function bpCheckList() {
  const b = S.bp, c = bpCalc(), sim = calcSim(), out = [];
  const empty = (v, l) => { if (!String(v || '').trim()) out.push(['warn', `「${l}」がまだ空欄です`]); };
  empty(S.profile.name || S.profile.owner, '屋号またはお名前');
  empty(b.motive, '1. 創業の目的・動機');
  if (!b.career.some(r => r.text.trim())) out.push(['warn', '「2. 経営者の略歴」がまだ空欄です']);
  if (!b.products.some(r => r.name.trim())) out.push(['warn', '「3. 商品・サービスの内容」がまだ空欄です']);
  empty(b.salesPoint, 'セールスポイント'); empty(b.target, '販売ターゲット・販売戦略');
  if (c.need === 0) out.push(['warn', '「7. 必要な資金」がまだ入っていません']);
  else if (c.need !== c.fund) out.push(['bad', `必要な資金（${yen(c.need)}）と調達の合計（${yen(c.fund)}）が一致していません`]);
  else { const r = (num(b.funds.own)) / c.need; out.push(['info', `自己資金は必要な資金の ${pct(r, 0)} です。自己資金の割合や、それをどう貯めてきたかは融資の審査で重視されます。`]); }
  if (num(b.outlook.later.sales) === 0) out.push(['warn', '「8. 事業の見通し」の売上が入っていません（「収支計画の数字を反映」が便利です）']);
  ['start', 'later'].forEach(k => { if (num(b.outlook[k].sales) > 0 && c[k].pro < 0) out.push(['bad', `${k === 'start' ? '創業当初' : '1年後'}の利益がマイナスです`]); });
  const repay = b.loans.reduce((a, l) => a + num(l.annual), 0) / 12;
  if (num(b.outlook.later.sales) > 0 && sim.living > 0 && c.later.pro < sim.living + repay)
    out.push(['warn', `1年後の利益（月${yen(c.later.pro)}）で、生活費（月${yen(sim.living)}）${repay ? `と個人の借入返済（月${yen(repay)}）` : ''}をまかなえるか確認しましょう。新しく借りる場合はその返済も必要です。`]);
  empty(b.basis, '数字の根拠');
  if (!out.some(x => x[0] === 'bad' || x[0] === 'warn')) out.unshift(['ok', '主な項目は記入済みです。PDFで保存して見直してみましょう。']);
  return out;
}

const App = {
  go(tab) { UI.tab = tab; try { sessionStorage.setItem('sogyo_tab', tab); } catch (e) {} render(); },
  // 収支計画
  simVal(k, v) { S.sim[k] = v; S.sim.touched = true; save(); updateSim(); },
  simItem(list, id, f, v) { const it = S.sim[list].find(i => i.id === id); if (!it) return; it[f] = f === 'amount' ? num(v) : v; S.sim.touched = true; save(); updateSim(); },
  simAdd(list) { S.sim[list].push({id: uid(), name: '', amount: 0}); save(); render(true); },
  simDel(list, id) { S.sim[list] = S.sim[list].filter(i => i.id !== id); save(); render(true); },
  simMode(m) { S.sim.gpMode = m; S.sim.touched = true; save(); render(true); },
  simPriceMode(m) {
    // 粗利率から決めた売値を、自分で入れる欄の初期値として引き継ぐ
    if (m === 'input' && S.sim.priceMode === 'gp') { const p = calcSim().price; if (p > 0 && sumAmt(S.sim.price) === 0) S.sim.price = [{id: uid(), name: '商品・サービスの単価', amount: niceUp(p)}]; }
    S.sim.priceMode = m; S.sim.touched = true; save(); render(true);
  },
  simUsePrice(p) {
    const name = (S.sim.price[0] && S.sim.price[0].name) || '商品・サービスの単価';
    S.sim.price = [{id: uid(), name, amount: p}]; S.sim.priceMode = 'input'; S.sim.touched = true;
    save(); render(true); toast('売値を ' + yen(p) + ' にしました');
  },
  preset(k) {
    if (!k) return;
    if (!confirm(`「${PRESETS[k].label}」のひな形を読み込みます。②固定費と③売値・原価の入力がおきかわります。よろしいですか？`)) { render(true); return; }
    Object.assign(S.sim, presetItems(k), {industry: k, gpMode: 'auto', priceMode: 'input', touched: true}); save(); render(true); toast('ひな形を読み込みました');
  },
  // 入出金
  recSub(k) { UI.recSub = k; if (k === 'form' && !UI.editId) UI.rec = UI.rec || newRec('in'); render(); },
  quick(type, plan) { UI.editId = null; UI.rec = newRec(type); if (plan) { UI.rec.plan = true; UI.rec.date = addMonthDate(today(), 1); } UI.recSub = 'form'; App.go('rec'); setTimeout(() => $('r-amount') && $('r-amount').focus(), 80); },
  recType(t) { if (UI.rec.type === t) return; UI.rec.type = t; UI.rec.cat = t === 'in' ? '売上' : '仕入'; render(true); },
  recCat(c) { UI.rec.cat = c; render(true); },
  recDate(v) { UI.rec.date = v; if (v > today() && !UI.rec.plan) { UI.rec.plan = true; toast('未来の日付なので「予定」にしました'); render(true); } },
  recSave() {
    const r = UI.rec, amt = Math.abs(num(r.amount));
    if (!amt) { toast('金額を入れてください'); $('r-amount') && $('r-amount').focus(); return; }
    if (!isYmd(r.date)) { toast('日付を入れてください'); return; }
    if (UI.editId) {
      const t = S.tx.find(x => x.id === UI.editId);
      if (t) Object.assign(t, {date: r.date, type: r.type, cat: r.cat, amount: amt, memo: r.memo.trim(), plan: !!r.plan});
      toast('修正しました'); UI.editId = null; UI.rec = newRec(r.type); UI.recSub = 'list'; UI.listYM = r.date.slice(0, 7);
    } else {
      S.tx.push({id: uid(), date: r.date, type: r.type, cat: r.cat, amount: amt, memo: r.memo.trim(), plan: !!r.plan});
      for (let k = 1; k <= (r.repeat || 0); k++) S.tx.push({id: uid(), date: addMonthDate(r.date, k), type: r.type, cat: r.cat, amount: amt, memo: r.memo.trim(), plan: true});
      toast(r.repeat ? `登録しました（予定${r.repeat}件も追加）` : '登録しました');
      UI.rec = {...newRec(r.type), date: r.date, cat: r.cat, plan: r.plan};
    }
    save(true); render(true);
    setTimeout(() => $('r-amount') && $('r-amount').focus(), 50);
  },
  edit(id) { const t = S.tx.find(x => x.id === id); if (!t) return; UI.editId = id; UI.rec = {type: t.type, date: t.date, cat: t.cat, amount: t.amount, memo: t.memo, plan: t.plan, repeat: 0}; UI.recSub = 'form'; App.go('rec'); },
  recCancel() { UI.editId = null; UI.rec = newRec('in'); UI.recSub = 'list'; render(); },
  recDel() { if (!confirm('この記録を削除しますか？')) return; S.tx = S.tx.filter(x => x.id !== UI.editId); UI.editId = null; UI.rec = newRec('in'); UI.recSub = 'list'; save(true); render(); toast('削除しました'); },
  done(id) { const t = S.tx.find(x => x.id === id); if (!t) return; t.plan = false; if (t.date > today()) t.date = today(); save(true); render(true); toast('実績にしました'); },
  listMonth(k) { UI.listYM = k === 0 ? curYM() : addMonth(UI.listYM, k); render(true); },
  listFilter(f) { UI.listFilter = f; render(true); },
  lateList() { const l = overduePlans().sort((a, b) => a.date.localeCompare(b.date)); UI.listYM = l.length ? l[0].date.slice(0, 7) : curYM(); UI.listFilter = 'plan'; UI.recSub = 'list'; App.go('rec'); },
  hours(m, v) { if (v === '' || v === null) delete S.hours[m]; else S.hours[m] = num(v); save(); render(true); },
  // 創業計画書
  bpSet(p, v) { setPath(S.bp, p, v); save(); updateBpCalc(); },
  bpAdd(list) { S.bp[list].push(blankRow(list)); save(); render(true); },
  bpDel(list, i) { const r = S.bp[list][i]; if (Object.values(r).some(v => String(v).trim() && !['販売先', '仕入先', '外注先'].includes(v)) && !confirm('この行を削除しますか？')) return; S.bp[list].splice(i, 1); save(); render(true); },
  prof(k, v) { S.profile[k] = v; save(); if (k === 'name') renderNav(); },
  bpReflect() {
    const s = calcSim();
    if (!s.valid || !s.target) { toast('先に「収支計画」を入力してください'); return; }
    if (!confirm('「収支計画」の数字を「8. 事業の見通し」に入れます。いま入っている数字は上書きされます。よろしいですか？')) return;
    const by = re => S.sim.fixed.filter(i => re.test(i.name)).reduce((a, i) => a + num(i.amount), 0);
    const staff = by(/人件/), rent = by(/家賃|地代/);
    const fill = (o, sales) => { o.sales = Math.round(sales); o.cost = Math.round(sales * (1 - s.gp)); o.staff = staff; o.rent = rent; o.other = Math.max(0, Math.round(s.fixed - staff - rent - num(o.interest))); };
    fill(S.bp.outlook.later, s.target);
    if (s.planSales > 0) fill(S.bp.outlook.start, s.planSales);
    const auto = `【収支計画より】生活費 月${comma(s.living)}円と固定費 月${comma(s.fixed)}円をまかなうには、粗利 月${comma(s.need)}円が必要。粗利率${pct(s.gp)}から目標売上は月${comma(s.target)}円（客単価${comma(s.price)}円 × 月${comma(s.cust)}人${s.days ? `、1日あたり約${s.perDay.toFixed(1)}人` : ''}）。` + (s.planSales > 0 ? `創業当初は月${comma(s.planCust)}人の来客を見込み、売上 月${comma(s.planSales)}円。` : '');
    S.bp.basis = S.bp.basis.replace(/【収支計画より】[^\n]*\n?/, '').trim();
    S.bp.basis = auto + (S.bp.basis ? '\n' + S.bp.basis : '');
    save(true); render(true); toast('事業の見通しに反映しました');
  },
  bpCheck() {
    const l = bpCheckList();
    $('bp-check').innerHTML = `<div class="card"><h2>記入チェック</h2>${l.map(([k, m]) => `<div class="note ${k}">${esc(m)}</div>`).join('')}<button class="btn sm" onclick="$('bp-check').innerHTML=''">閉じる</button></div>`;
    $('bp-check').scrollIntoView({behavior: 'smooth', block: 'start'});
  },
  printBp() {
    const appx = calcSim().valid && S.sim.touched ? confirm('収支計画の逆算表を「別紙」として最後のページに付けますか？\n（OK＝付ける／キャンセル＝付けない）') : false;
    printDoc(bpDocHTML(appx), '創業計画書_' + (S.profile.name || S.profile.owner || '') + '_' + today());
    toast('印刷画面で「PDF形式で保存」を選んでください');
  },
  printCash() { printDoc(cashDocHTML(), '資金繰り表_' + today()); },
  // データ
  backup() {
    const data = JSON.stringify({app: 'sogyo-support', version: 1, exportedAt: new Date().toISOString(), data: S}, null, 1);
    download(new Blob([data], {type: 'application/json'}), `創業サポート_バックアップ_${today()}.json`);
    S.meta.lastBackup = new Date().toISOString(); save(true); if (UI.tab !== 'rec') render(true);
  },
  pick(kind) { const f = $('file'); f.value = ''; f.accept = kind === 'json' ? '.json,application/json' : '.csv,text/csv,text/plain'; f.dataset.kind = kind; f.click(); },
  csvOut() {
    const q = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = [['日付', '区分', 'カテゴリ', '金額', '摘要', '状態']].concat([...S.tx].sort((a, b) => a.date.localeCompare(b.date)).map(t => [t.date, t.type === 'in' ? '入金' : '出金', t.cat, t.amount, t.memo, t.plan ? '予定' : '実績']));
    download(new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), rows.map(r => r.map(q).join(',')).join('\r\n')], {type: 'text/csv'}), `入出金_${today()}.csv`);
  },
  wipe() {
    if (!confirm('すべてのデータ（入出金・収支計画・創業計画書）を消去します。元に戻せません。よろしいですか？')) return;
    if (!confirm('本当に消去しますか？（バックアップは取りましたか？）')) return;
    S = normalize(null); save(true); UI.editId = null; UI.rec = null; App.go('home'); toast('消去しました');
  }
};
window.App = App;

function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('「ダウンロード」フォルダに保存しました');
}
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function importCSV(text) {
  const rows = parseCSV(text.replace(/^﻿/, ''));
  if (rows.length < 2) { toast('読み込めるデータがありません'); return; }
  const h = rows[0].map(x => x.trim()), ix = n => h.indexOf(n);
  const iD = ix('日付'), iT = ix('区分'), iC = ix('カテゴリ'), iA = ix('金額'), iM = ix('摘要'), iS = ix('状態');
  if (iD < 0 || iA < 0 || iT < 0) { toast('「日付・区分・金額」の列が見つかりません'); return; }
  const key = t => [t.date, t.type, t.cat, t.amount, t.memo].join('|');
  const have = new Set(S.tx.map(key)); let add = 0, skip = 0;
  rows.slice(1).forEach(r => {
    const date = (r[iD] || '').trim().replace(/\//g, '-').replace(/-(\d)(?=-|$)/g, '-0$1');
    const type = /入/.test(r[iT] || '') ? 'in' : /出/.test(r[iT] || '') ? 'out' : null;
    const amount = Math.abs(num(r[iA]));
    if (!isYmd(date) || !type || !amount) { skip++; return; }
    let cat = (iC >= 0 ? r[iC] : '').trim(); cat = OLD_CAT[cat] || cat || (type === 'in' ? '売上' : 'その他の経費');
    // 旧アプリのCSVはメモ内のカンマで列がずれることがあるので、摘要以降をつなげる
    const memo = iM >= 0 ? (iS >= 0 ? r[iM] : r.slice(iM).join(',')) : '';
    const t = {id: uid(), date, type, cat, amount, memo: (memo || '').trim(), plan: iS >= 0 && /予定/.test(r[iS] || '')};
    if (have.has(key(t))) { skip++; return; }
    have.add(key(t)); S.tx.push(t); add++;
  });
  save(true); render(); toast(`${add}件を読み込みました${skip ? `（${skip}件は重複・不正のため除外）` : ''}`);
}
$('file').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const kind = e.target.dataset.kind, rd = new FileReader();
  rd.onload = () => {
    try {
      if (kind === 'json') {
        const j = JSON.parse(rd.result); const d = j && j.data ? j.data : j;
        if (!d || !d.sim || !Array.isArray(d.tx)) { toast('このアプリのバックアップファイルではないようです'); return; }
        if (!confirm(`バックアップ（入出金${d.tx.length}件）で、いまのデータをおきかえます。よろしいですか？`)) return;
        S = normalize(d); save(true); render(); toast('バックアップから戻しました');
      } else importCSV(rd.result);
    } catch (err) { toast('ファイルを読み込めませんでした'); }
  };
  rd.readAsText(file, 'utf-8');
});

/* ---------- 起動 ---------- */
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
